<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTTD</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; background: #000; }
  #status { position: fixed; left: 0; right: 0; bottom: 8vh; text-align: center; color: #c8c8c8; font: 600 15px/1.4 system-ui, sans-serif; letter-spacing: .04em; pointer-events: none; text-shadow: 0 1px 2px #000; white-space: pre-line; }
  #status:empty { display: none; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="status">Loading…</div>
<script>
  // OpenTTD web build (openttd-online, GPL-2.0). Saves live in the browser's
  // IndexedDB via the build's own IDBFS mount; OpenGFX is written into the
  // game's baseset directory before main() so first run needs no download.
  const canvas = document.getElementById('canvas');
  const status = document.getElementById('status');
  const say = (t) => { status.textContent = t; };
  var Module = {
    canvas,
    arguments: [], postRun: [],  // the build's pre.js pushes onto these
    print: (...a) => console.log(...a),
    printErr: (...a) => console.warn(...a),
    setStatus(text) {
      const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      say(m ? `${m[1].trim()} ${Math.round((+m[2] / +m[4]) * 100)}%` : text);
    },
    totalDependencies: 0,
    monitorRunDependencies(left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? `Preparing… (${this.totalDependencies - left}/${this.totalDependencies})` : '');
    },
    preRun: [function loadOpenGFX() {
      Module.addRunDependency('opengfx');
      fetch('baseset/opengfx-7.1.tar').then((r) => { if (!r.ok) throw new Error(`OpenGFX ${r.status}`); return r.arrayBuffer(); })
        .then((buf) => { FS.createPath('/', 'baseset', true, true); FS.writeFile('/baseset/opengfx-7.1.tar', new Uint8Array(buf)); })
        .catch((e) => { console.warn('OpenGFX preload failed, falling back to OpenTTD bootstrap', e); })
        .finally(() => Module.removeRunDependency('opengfx'));
    }],
    onBootstrap(bytes, total) { say(`Downloading base graphics… ${Math.round(bytes / 1024)} / ${Math.round(total / 1024)} KB`); },
    onBootstrapFailed() { say('Base graphics download failed — check the connection and reload.'); },
    onBootstrapReload() { say('Base graphics ready — restarting…'); },
    onWarningFs() { console.warn('OpenTTD: save sync to IndexedDB failed'); },
    onExit() { say('OpenTTD closed — press EJECT.'); },
    onAbort() { say('OpenTTD stopped unexpectedly — see the console.'); },
  };
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); say('Graphics context lost — reload to play again.'); });
  canvas.addEventListener('click', () => canvas.focus());
</script>
<script async src="openttd.js"></script>
</body>
</html>
