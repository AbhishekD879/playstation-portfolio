<!doctype html>
<!-- TIC-80 (nesbox/TIC-80, MIT) — the official web build, self-hosted. The parent
     frame posts the cart's bytes; they are dropped into the emulator's file system
     before main() runs and passed as the cart argument, exactly like `tic80 game.tic`.
     Same-origin iframe host, like /play/ and /pc/. -->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; outline: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #9fb8e0; font: 13px/1.6 monospace; letter-spacing: 0.3em; text-align: center; }
  #boot span { display: block; opacity: 0.55; letter-spacing: 0.12em; }
</style>
</head>
<body>
<div id="boot">TIC-80<span id="bootsub">waiting for the cart…</span></div>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // Tell the parent we can take the cart, then wait for it.
  const sub = (t) => (document.getElementById("bootsub").textContent = t);
  addEventListener("message", (e) => {
    if (e.source !== parent || !e.data || e.data.type !== "cart") return;
    const name = (e.data.name || "cart.tic").replace(/[^\w.-]/g, "_");
    const bytes = new Uint8Array(e.data.bytes);
    sub("loading " + name);
    window.Module = {
      canvas: document.getElementById("canvas"),
      // --skip drops the boot animation; the cart name is argv[1], as on the desktop
      arguments: [name, "--skip"],
      locateFile: (p) => "/tic80/" + p,
      preRun: [() => {
        const create = Module.FS_createDataFile || (Module.FS && Module.FS.createDataFile);
        if (!create) { sub("this build cannot take a cart file"); return; }
        create("/", name, bytes, true, false, true);
      }],
      onRuntimeInitialized: () => { document.getElementById("boot").style.display = "none"; document.getElementById("canvas").focus(); },
      print: (t) => console.log("[tic80]", t),
      printErr: (t) => console.warn("[tic80]", t),
    };
    const s = document.createElement("script");
    s.src = "/tic80/tic80.js";
    document.body.appendChild(s);
  }, { once: true });
  parent.postMessage({ type: "ready" }, location.origin);
</script>
</body>
</html>
